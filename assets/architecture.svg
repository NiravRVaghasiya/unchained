<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A855F7"/>
    </marker>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B949E"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="980" height="560" rx="16" fill="#0E1117"/>

  <!-- title -->
  <text x="40" y="52" font-size="30" font-weight="700" fill="#A855F7">Unchained</text>
  <text x="42" y="78" font-size="14" fill="#8B949E">single-file agentic AI framework &#183; tools &#183; memory &#183; RAG &#183; multi-agent &#183; structured output</text>

  <!-- Router -->
  <rect x="360" y="104" width="260" height="58" rx="10" fill="#161B22" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="490" y="130" text-anchor="middle" font-size="16" font-weight="600" fill="#E6EDF3">Router</text>
  <text x="490" y="150" text-anchor="middle" font-size="11.5" fill="#8B949E">route &#183; run_all &#183; synthesize</text>
  <line x1="490" y1="162" x2="490" y2="206" stroke="#A855F7" stroke-width="1.5" marker-end="url(#arrowA)"/>

  <!-- Agent -->
  <rect x="330" y="208" width="320" height="182" rx="14" fill="#12161D" stroke="#7C3AED" stroke-width="2"/>
  <text x="490" y="236" text-anchor="middle" font-size="16" font-weight="700" fill="#E6EDF3">Agent &#8226; ReAct loop</text>

  <!-- Think -->
  <rect x="345" y="266" width="86" height="54" rx="9" fill="#161B22" stroke="#30363D"/>
  <text x="388" y="290" text-anchor="middle" font-size="13" font-weight="600" fill="#E6EDF3">Think</text>
  <text x="388" y="307" text-anchor="middle" font-size="10.5" fill="#58A6FF">LLM</text>
  <!-- Act -->
  <rect x="447" y="266" width="86" height="54" rx="9" fill="#161B22" stroke="#30363D"/>
  <text x="490" y="290" text-anchor="middle" font-size="13" font-weight="600" fill="#E6EDF3">Act</text>
  <text x="490" y="307" text-anchor="middle" font-size="10.5" fill="#D29922">tool</text>
  <!-- Observe -->
  <rect x="549" y="266" width="86" height="54" rx="9" fill="#161B22" stroke="#30363D"/>
  <text x="592" y="290" text-anchor="middle" font-size="13" font-weight="600" fill="#E6EDF3">Observe</text>
  <text x="592" y="307" text-anchor="middle" font-size="10.5" fill="#3FB950">result</text>

  <line x1="431" y1="293" x2="447" y2="293" stroke="#8B949E" stroke-width="1.4" marker-end="url(#arrowM)"/>
  <line x1="533" y1="293" x2="549" y2="293" stroke="#8B949E" stroke-width="1.4" marker-end="url(#arrowM)"/>
  <!-- repeat loop -->
  <path d="M592,320 C592,352 388,352 388,322" fill="none" stroke="#8B949E" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowM)"/>
  <text x="490" y="349" text-anchor="middle" font-size="10.5" fill="#8B949E">repeat until done</text>

  <!-- User -->
  <rect x="60" y="250" width="150" height="54" rx="10" fill="#161B22" stroke="#30363D"/>
  <text x="135" y="282" text-anchor="middle" font-size="14" font-weight="600" fill="#E6EDF3">User query</text>
  <line x1="210" y1="277" x2="330" y2="290" stroke="#A855F7" stroke-width="1.5" marker-end="url(#arrowA)"/>

  <!-- Response -->
  <rect x="770" y="250" width="150" height="54" rx="10" fill="#161B22" stroke="#30363D"/>
  <text x="845" y="274" text-anchor="middle" font-size="14" font-weight="600" fill="#E6EDF3">Response</text>
  <text x="845" y="292" text-anchor="middle" font-size="10.5" fill="#8B949E">text or Pydantic</text>
  <line x1="650" y1="290" x2="770" y2="277" stroke="#A855F7" stroke-width="1.5" marker-end="url(#arrowA)"/>

  <!-- capabilities -->
  <text x="490" y="428" text-anchor="middle" font-size="11.5" fill="#8B949E">pluggable capabilities composed into the Agent</text>

  <rect x="70" y="440" width="180" height="60" rx="10" fill="#161B22" stroke="#30363D"/>
  <text x="160" y="466" text-anchor="middle" font-size="14" font-weight="600" fill="#E6EDF3">LLM</text>
  <text x="160" y="484" text-anchor="middle" font-size="10.5" fill="#8B949E">OpenAI &#183; Anthropic &#183; Ollama</text>

  <rect x="280" y="440" width="180" height="60" rx="10" fill="#161B22" stroke="#30363D"/>
  <text x="370" y="466" text-anchor="middle" font-size="14" font-weight="600" fill="#E6EDF3">Memory</text>
  <text x="370" y="484" text-anchor="middle" font-size="10.5" fill="#8B949E">window + summary</text>

  <rect x="490" y="440" width="180" height="60" rx="10" fill="#161B22" stroke="#30363D"/>
  <text x="580" y="466" text-anchor="middle" font-size="14" font-weight="600" fill="#E6EDF3">RAG</text>
  <text x="580" y="484" text-anchor="middle" font-size="10.5" fill="#8B949E">TF-IDF + cosine</text>

  <rect x="700" y="440" width="180" height="60" rx="10" fill="#161B22" stroke="#30363D"/>
  <text x="790" y="466" text-anchor="middle" font-size="14" font-weight="600" fill="#E6EDF3">Tools</text>
  <text x="790" y="484" text-anchor="middle" font-size="10.5" fill="#8B949E">@tool auto-schema</text>

  <line x1="160" y1="440" x2="360" y2="388" stroke="#8B949E" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowM)"/>
  <line x1="370" y1="440" x2="440" y2="390" stroke="#8B949E" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowM)"/>
  <line x1="580" y1="440" x2="545" y2="390" stroke="#8B949E" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowM)"/>
  <line x1="790" y1="440" x2="625" y2="388" stroke="#8B949E" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowM)"/>
</svg>
